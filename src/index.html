<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embiggenizer</title>
  <meta name="description" content="Type some text, press Embiggenize, and see it as large as your screen allows.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main id="editor">
    <h1>Embiggenizer</h1>
    <p class="tagline">Type something. See it as big as your screen allows.</p>

    <form id="form" novalidate>
      <label for="text">Your text</label>
      <textarea id="text" name="text" rows="4" placeholder="Hello!" autocomplete="off" aria-describedby="hint shortcuts"></textarea>
      <p id="hint" class="hint" aria-live="polite"></p>
      <button type="submit" class="primary">Embiggenize</button>
      <p id="shortcuts" class="shortcuts">
        Shortcuts: <kbd>Ctrl</kbd>+<kbd>Enter</kbd> (<kbd>⌘</kbd>+<kbd>Enter</kbd> on a Mac) to embiggenize, <kbd>Esc</kbd> to come back.
      </p>
    </form>

    <noscript><p class="hint">The Embiggenizer needs JavaScript to measure your screen.</p></noscript>

    <section class="videos" aria-labelledby="videos-heading">
      <h2 id="videos-heading">Watch where “embiggen” comes from</h2>
      <p id="videos-note" class="videos-note">
        Pick a video to play it here. It comes from YouTube, and nothing loads from YouTube until you pick one.
      </p>
      <ul class="video-list">
        <li>
          <button type="button" class="secondary video-choice" data-video="jno3nXowcyQ" aria-pressed="false" aria-describedby="videos-note">
            <span class="video-title">“A noble spirit embiggens the smallest man”</span>
            <span class="video-source">A clip from <cite>The Simpsons</cite>, uploaded by CLIPS TV</span>
          </button>
        </li>
        <li>
          <button type="button" class="secondary video-choice" data-video="DMEvFgp6vlY" aria-pressed="false" aria-describedby="videos-note">
            <span class="video-title">Lisa’s ban from the Historical Society</span>
            <span class="video-source">A clip from “Lisa the Iconoclast”, uploaded by The Max Power Way</span>
          </button>
        </li>
        <li>
          <button type="button" class="secondary video-choice" data-video="WTzGnRQ9cfA" aria-pressed="false" aria-describedby="videos-note">
            <span class="video-title">“Embiggen” is a perfectly cromulent word</span>
            <span class="video-source">Pop Lexicon, from The A.V. Club</span>
          </button>
        </li>
      </ul>
      <div id="player" class="player" hidden>
        <div id="player-frame" class="player-frame"></div>
        <button id="close-video" type="button" class="secondary">Close video</button>
      </div>
    </section>

    <footer>
      <figure>
        <blockquote>“A noble spirit embiggens the smallest man.”</blockquote>
        <figcaption>
          The town motto of Springfield, credited to its founder Jebediah Springfield, in
          <cite>The Simpsons</cite> episode
          <a href="https://www.imdb.com/title/tt0701155/">“Lisa the Iconoclast” on IMDb</a>
          (season 7, episode 16, first aired February 18, 1996). The writers made up
          “embiggen” for the episode; Merriam-Webster added it to the dictionary in 2018.
          The same scene made up a second word: when Mrs. Krabappel doubts “embiggens”,
          Miss Hoover calls it “a perfectly cromulent word.”
        </figcaption>
      </figure>
    </footer>
  </main>

  <section id="stage" class="stage" tabindex="-1" aria-label="Embiggenized text" hidden>
    <div id="big" class="big"></div>
    <div class="controls">
      <button id="copy-link" type="button" hidden>Copy link</button>
      <button id="fullscreen" type="button" hidden>Full screen</button>
      <button id="back" type="button">Back</button>
      <p id="copy-status" class="copy-status" role="status"></p>
    </div>
  </section>
</body>
</html>
